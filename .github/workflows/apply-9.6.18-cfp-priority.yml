name: Apply Saturday Foundry 9.6.18 CFP bracket priority

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-9.6.18-cfp-priority.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Move CFP bracket to top of Schedule
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          assert '9.6.17-bowl-name-visibility' in s
          block='''    <section id="cfpBracketSection" class="cfp-bracket-shell hidden" aria-label="College Football Playoff bracket">\n      <div class="cfp-bracket-head">\n        <div><div class="cfp-bracket-kicker">COLLEGE FOOTBALL PLAYOFF</div><h3>Road to Miami.</h3></div>\n        <div id="cfpBracketMeta" class="cfp-bracket-meta"></div>\n      </div>\n      <div id="cfpBracketPath" class="cfp-bracket-path"></div>\n      <div class="cfp-bracket-scroll"><div id="cfpBracketBoard" class="cfp-bracket-grid"></div></div>\n    </section>\n\n'''
          assert s.count(block)==1
          s=s.replace(block,'',1)
          anchor='''    </div>\n\n    <section id="myScheduleBuilder" class="my-schedule-builder hidden">'''
          assert anchor in s
          s=s.replace(anchor,'''    </div>\n\n'''+block+'''    <section id="myScheduleBuilder" class="my-schedule-builder hidden">''',1)
          s=s.replace('Saturday Foundry 9.6.17 — Bowl Name Visibility','Saturday Foundry 9.6.18 — CFP Bracket Priority',1)
          s=s.replace('9.6.17-bowl-name-visibility','9.6.18-cfp-bracket-priority',1)
          p.write_text(s)
          PY

      - name: Verify ordering and regression anchors
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          keys=['id="schedule"','id="cfpBracketSection"','id="myScheduleBuilder"','id="weekNav"','class="v21-current-week"','class="v21-season-archive"']
          pos={k:s.index(k) for k in keys}
          assert pos['id="schedule"'] < pos['id="cfpBracketSection"'] < pos['id="myScheduleBuilder"'] < pos['id="weekNav"'] < pos['class="v21-current-week"'] < pos['class="v21-season-archive"']
          PY
          grep -q '9.6.18-cfp-bracket-priority' index.html
          grep -q 'q.game?.event_name||q.meta?.quarterfinal_bowl' index.html
          grep -q 'function cfpAdvanceTeam(t){return t?{...t,score:null}:t}' index.html
          grep -q 'window.CDHQRefresh=refreshFoundryData' index.html
          grep -q 'CPU-v-CPU is always neutral' index.html
          grep -q 'coach-bowl-ledger' index.html

      - name: Verify JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          out=Path('/tmp/sfjs'); out.mkdir(exist_ok=True)
          blocks=[]
          for m in re.finditer(r'<script\b([^>]*)>(.*?)</script>',s,re.I|re.S):
              if re.search(r'\bsrc\s*=',m.group(1),re.I): continue
              blocks.append(m.group(2))
          for i,b in enumerate(blocks): (out/f'{i:03}.js').write_text(b)
          print(f'inline_scripts={len(blocks)}')
          PY
          for f in /tmp/sfjs/*.js; do node --check "$f" >/dev/null; done

      - name: Commit build
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Saturday Foundry Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Release Saturday Foundry 9.6.18 CFP bracket priority'
          git push
