name: Apply Saturday Foundry 9.6.16 CFP score carryover fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-9.6.16-cfp-score-carryover.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Apply CFP advancement score reset
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          assert '9.6.15-state-preserving-refresh' in s

          old='function cfpVirtualTeam(name,seed=null){return {name,seed,tbd:true,team_id:null,person_id:null,score:null}}\n'
          new='function cfpVirtualTeam(name,seed=null){return {name,seed,tbd:true,team_id:null,person_id:null,score:null}}\nfunction cfpAdvanceTeam(t){return t?{...t,score:null}:t}\n'
          assert old in s
          s=s.replace(old,new,1)

          old='[bye||cfpVirtualTeam(`#${targetSeed} seed`,targetSeed),adv||cfpVirtualTeam(`Winner ${pairKey(g).split(\'-\').map(x=>\'#\'+x).join(\' / \')}`)]'
          new='[bye||cfpVirtualTeam(`#${targetSeed} seed`,targetSeed),cfpAdvanceTeam(adv)||cfpVirtualTeam(`Winner ${pairKey(g).split(\'-\').map(x=>\'#\'+x).join(\' / \')}`)]'
          assert old in s
          s=s.replace(old,new,1)

          old='if(actual&&adv){const open=teams.findIndex(t=>!t?.team_id||t?.tbd||teamKey(t?.name)==="tbd");if(open>=0)teams[open]=adv}'
          new='if(actual&&adv){const open=teams.findIndex(t=>!t?.team_id||t?.tbd||teamKey(t?.name)==="tbd");if(open>=0)teams[open]=cfpAdvanceTeam(adv)}'
          assert old in s
          s=s.replace(old,new,1)

          old='teams:actual?cfpGamePair(actual):[a||cfpVirtualTeam(`Winner ${pair[0].slot}`),b||cfpVirtualTeam(`Winner ${pair[1].slot}`)]'
          new='teams:actual?cfpGamePair(actual):[cfpAdvanceTeam(a)||cfpVirtualTeam(`Winner ${pair[0].slot}`),cfpAdvanceTeam(b)||cfpVirtualTeam(`Winner ${pair[1].slot}`)]'
          assert old in s
          s=s.replace(old,new,1)

          old='const champTeams=champGame?cfpGamePair(champGame):[semiWinner(semis[0])||cfpVirtualTeam("Winner SF1"),semiWinner(semis[1])||cfpVirtualTeam("Winner SF2")];'
          new='const champTeams=champGame?cfpGamePair(champGame):[cfpAdvanceTeam(semiWinner(semis[0]))||cfpVirtualTeam("Winner SF1"),cfpAdvanceTeam(semiWinner(semis[1]))||cfpVirtualTeam("Winner SF2")];'
          assert old in s
          s=s.replace(old,new,1)

          s=s.replace('9.6.15-state-preserving-refresh','9.6.16-cfp-score-carryover-fix',1)
          s=s.replace('Saturday Foundry 9.6.15 — State-Preserving In-App Refresh','Saturday Foundry 9.6.16 — CFP Score Carryover Fix',1)
          p.write_text(s)
          PY

      - name: Verify regression anchors
        shell: bash
        run: |
          set -euo pipefail
          grep -q '9.6.16-cfp-score-carryover-fix' index.html
          grep -q 'function cfpAdvanceTeam(t){return t?{...t,score:null}:t}' index.html
          grep -q 'cfpAdvanceTeam(adv)' index.html
          grep -q '9.6.15 — State-Preserving In-App Refresh\|window.CDHQRefresh=refreshFoundryData' index.html
          grep -q 'CPU-v-CPU is always neutral' index.html
          grep -q 'LEGACY DEFINES THE COACH\|Legacy Defines the Coach' index.html
          grep -q 'coach-bowl-ledger' index.html

      - name: Verify JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          out=Path('/tmp/sfjs'); out.mkdir(exist_ok=True)
          blocks=[]
          for m in re.finditer(r'<script\b([^>]*)>(.*?)</script>',s,re.I|re.S):
              if re.search(r'\bsrc\s*=',m.group(1),re.I): continue
              blocks.append(m.group(2))
          for i,b in enumerate(blocks): (out/f'{i:03}.js').write_text(b)
          print(f'inline_scripts={len(blocks)}')
          PY
          for f in /tmp/sfjs/*.js; do node --check "$f" >/dev/null; done

      - name: Commit fixed build
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Saturday Foundry Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Release Saturday Foundry 9.6.16 CFP score carryover fix'
          git push
