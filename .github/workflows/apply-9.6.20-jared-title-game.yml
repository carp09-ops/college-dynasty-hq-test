name: Apply Saturday Foundry 9.6.20 Jared title game reconciliation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-9.6.20-jared-title-game.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Apply Jared championship reconciliation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          assert '9.6.19-cfp-completion-collapse' in s
          old='{season_number:3,event_name:"National Championship",team_name:"Kennesaw State",opponent_team:"Matchup details not preserved",points_for:null,points_against:null,result:"L",archived:true}'
          new='{season_number:3,event_name:"National Championship",team_name:"Kennesaw State",opponent_team:"Oklahoma",points_for:24,points_against:45,result:"L",archived:false}'
          assert old in s
          s=s.replace(old,new,1)
          s=s.replace('Saturday Foundry 9.6.19 — CFP Completion Collapse','Saturday Foundry 9.6.20 — Jared Championship Reconciliation',1)
          s=s.replace('9.6.19-cfp-completion-collapse','9.6.20-jared-championship-reconciliation',1)
          p.write_text(s)
          PY

      - name: Verify regression anchors
        shell: bash
        run: |
          set -euo pipefail
          grep -q '9.6.20-jared-championship-reconciliation' index.html
          grep -q 'opponent_team:"Oklahoma",points_for:24,points_against:45,result:"L"' index.html
          grep -q 'cfp-complete-compact' index.html
          grep -q 'function cfpAdvanceTeam(t){return t?{...t,score:null}:t}' index.html
          grep -q 'window.CDHQRefresh=refreshFoundryData' index.html
          grep -q 'CPU-v-CPU is always neutral' index.html
          grep -q 'coach-bowl-ledger' index.html

      - name: Verify JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          out=Path('/tmp/sfjs'); out.mkdir(exist_ok=True)
          blocks=[]
          for m in re.finditer(r'<script\b([^>]*)>(.*?)</script>',s,re.I|re.S):
              if re.search(r'\bsrc\s*=',m.group(1),re.I): continue
              blocks.append(m.group(2))
          for i,b in enumerate(blocks): (out/f'{i:03}.js').write_text(b)
          print(f'inline_scripts={len(blocks)}')
          PY
          for f in /tmp/sfjs/*.js; do node --check "$f" >/dev/null; done

      - name: Commit build
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Saturday Foundry Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Release Saturday Foundry 9.6.20 Jared championship reconciliation'
          git push
