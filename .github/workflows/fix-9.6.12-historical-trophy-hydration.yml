name: Apply Saturday Foundry 9.6.12 historical trophy hydration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-9.6.12-historical-trophy-hydration.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Patch Trophy Room historical hydration
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()

          old=' const allGames=[...(state.allGames||[])];'
          new=' const allGames=(Array.isArray(state.allGames)&&state.allGames.length)?[...state.allGames]:[...(state.games||[])];'
          if old not in s:
              raise SystemExit('Expected Trophy Room allGames anchor not found')
          s=s.replace(old,new,1)

          old2="if(sets.length){state.allGames=sets.flat();renderCoaches();renderStorylines();renderRivalries();renderHQCommand();renderSeasonRecap();renderRecordBook();renderCareer();updateOverviewDataVisibility();}"
          new2="if(sets.length){state.allGames=sets.flat();renderCoaches();renderStorylines();renderRivalries();renderHQCommand();renderSeasonRecap();renderRecordBook();renderCareer();renderTrophies();updateOverviewDataVisibility();}"
          if old2 not in s:
              raise SystemExit('Expected historical hydration callback not found')
          s=s.replace(old2,new2,1)

          s=s.replace('<!-- Saturday Foundry 9.6.11 — Career Bowl Ledger -->','<!-- Saturday Foundry 9.6.12 — Historical Trophy Hydration -->',1)
          s=s.replace('<meta name="saturday-foundry-release" content="9.6.11-career-bowl-ledger">','<meta name="saturday-foundry-release" content="9.6.12-historical-trophy-hydration">',1)
          p.write_text(s)
          PY

      - name: Verify JavaScript syntax
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const s=fs.readFileSync('index.html','utf8');
          const scripts=[...s.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].map(m=>m[1]);
          let bad=0;
          scripts.forEach((x,i)=>{try{new Function(x)}catch(e){bad++;console.error(`script ${i}: ${e.message}`)}});
          console.log(`scripts=${scripts.length} bad=${bad}`);
          if(bad) process.exit(1);
          NODE

      - name: Commit 9.6.12
        run: |
          git config user.name "Saturday Foundry Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Release Saturday Foundry 9.6.12 historical trophy hydration"
          git push
