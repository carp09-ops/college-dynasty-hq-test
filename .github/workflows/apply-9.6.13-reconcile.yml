name: Apply Saturday Foundry 9.6.13 reconciliation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-9.6.13-reconcile.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Rebuild and apply reconciled patch
        run: |
          set -euo pipefail
          grep -q '9.6.12-historical-trophy-hydration' index.html
          cat .github/patches/9.6.13.part1 .github/patches/9.6.13.part2 .github/patches/9.6.13.part3 .github/patches/9.6.13.part4 .github/patches/9.6.13.part5 .github/patches/9.6.13.part6 > /tmp/patch.b64
          test "$(wc -c < /tmp/patch.b64)" -eq 20508
          base64 -d /tmp/patch.b64 | gunzip > /tmp/9.6.13.patch
          test "$(sha256sum /tmp/9.6.13.patch | cut -d' ' -f1)" = 'b072aaea1dc54b1fca536dfe67c4e57a4046baf135b7172c63e672087a47ae2c'
          patch -p0 < /tmp/9.6.13.patch

      - name: Verify reconciliation anchors
        run: |
          grep -q '9.6.13-postseason-trophy-reconciliation' index.html
          grep -q 'CAREER BOWL LEDGER' index.html
          grep -q 'LEGACY DEFINES THE COACH' index.html
          grep -q 'function renderCfpBracket' index.html
          grep -q 'Conference Championships' index.html
          grep -q 'Bowl Week 1' index.html
          grep -q 'Bowl Week 2' index.html
          grep -q 'async function saveNationalResults' index.html
          grep -q 'async function finalizeNationalWeek' index.html
          grep -q 'renderTrophies();updateOverviewDataVisibility();' index.html
          ! grep -q 'LEGACY DEFINES THE PROGRAM' index.html

      - name: Verify JavaScript syntax
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const s=fs.readFileSync('index.html','utf8');
          const scripts=[...s.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].map(m=>m[1]);
          let bad=0;
          scripts.forEach((x,i)=>{try{new Function(x)}catch(e){bad++;console.error(`script ${i}: ${e.message}`)}});
          console.log(`scripts=${scripts.length} bad=${bad}`);
          if(bad) process.exit(1);
          NODE

      - name: Commit reconciled build
        run: |
          git config user.name "Saturday Foundry Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Release Saturday Foundry 9.6.13 postseason trophy reconciliation"
          git push
