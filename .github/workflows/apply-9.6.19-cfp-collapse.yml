name: Apply Saturday Foundry 9.6.19 CFP completion collapse

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-9.6.19-cfp-collapse.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Apply CFP completion collapse
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          assert '9.6.18-cfp-bracket-priority' in s

          old='.cfp-bracket-shell.hidden{display:none}\n'
          new='''.cfp-bracket-shell.hidden{display:none}\n.cfp-bracket-compact{display:none}\n.cfp-bracket-shell.cfp-complete:not(.cfp-expanded){padding:14px 16px}\n.cfp-bracket-shell.cfp-complete:not(.cfp-expanded) .cfp-bracket-compact{display:grid;grid-template-columns:1fr auto;gap:10px 14px;align-items:center}\n.cfp-bracket-shell.cfp-complete:not(.cfp-expanded) .cfp-bracket-head,.cfp-bracket-shell.cfp-complete:not(.cfp-expanded) .cfp-bracket-path,.cfp-bracket-shell.cfp-complete:not(.cfp-expanded) .cfp-bracket-scroll{display:none}\n.cfp-compact-kicker{font-size:9px;font-weight:900;letter-spacing:.16em;color:var(--sf-gold-bright,#e5bd63)}\n.cfp-compact-title{margin:3px 0 0;font-family:"Barlow Condensed",sans-serif;font-size:23px;line-height:1.05;text-transform:uppercase;color:#f6f4ee}\n.cfp-compact-meta{margin-top:5px;font-size:10px;color:#9eb0b8}.cfp-compact-meta b{color:#dce8ec}\n.cfp-compact-foundry{grid-column:1/-1;padding-top:9px;border-top:1px solid rgba(229,189,99,.14);font-size:9px;color:#8fa2aa;letter-spacing:.03em}.cfp-compact-foundry b{color:var(--sf-gold-bright,#e5bd63)}\n.cfp-compact-toggle{appearance:none;border:1px solid rgba(229,189,99,.38);border-radius:999px;background:rgba(229,189,99,.08);color:#f1d88d;font-size:9px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;padding:9px 12px;white-space:nowrap}\n'''
          assert old in s
          s=s.replace(old,new,1)

          old='@media(max-width:720px){.cfp-bracket-shell{margin:12px 0 14px;padding:13px 10px}.cfp-bracket-head{align-items:flex-start;flex-direction:column;gap:5px}.cfp-bracket-head h3{font-size:27px}.cfp-bracket-meta{text-align:left}.cfp-bracket-grid{grid-template-columns:repeat(4,210px);min-width:882px}.cfp-bracket-scroll{margin-right:-6px}.cfp-team-slot{grid-template-columns:22px 26px 1fr auto;padding:8px 7px}.cfp-team-name{font-size:10px}}'
          new='@media(max-width:720px){.cfp-bracket-shell{margin:12px 0 14px;padding:13px 10px}.cfp-bracket-shell.cfp-complete:not(.cfp-expanded){padding:12px}.cfp-bracket-shell.cfp-complete:not(.cfp-expanded) .cfp-bracket-compact{grid-template-columns:1fr}.cfp-compact-toggle{justify-self:start}.cfp-bracket-head{align-items:flex-start;flex-direction:column;gap:5px}.cfp-bracket-head h3{font-size:27px}.cfp-bracket-meta{text-align:left}.cfp-bracket-grid{grid-template-columns:repeat(4,210px);min-width:882px}.cfp-bracket-scroll{margin-right:-6px}.cfp-team-slot{grid-template-columns:22px 26px 1fr auto;padding:8px 7px}.cfp-team-name{font-size:10px}}'
          assert old in s
          s=s.replace(old,new,1)

          old='''    <section id="cfpBracketSection" class="cfp-bracket-shell hidden" aria-label="College Football Playoff bracket">\n      <div class="cfp-bracket-head">'''
          new='''    <section id="cfpBracketSection" class="cfp-bracket-shell hidden" aria-label="College Football Playoff bracket">\n      <div id="cfpBracketCompact" class="cfp-bracket-compact"></div>\n      <div class="cfp-bracket-head">'''
          assert old in s
          s=s.replace(old,new,1)

          old='''function renderCfpBracket(allSeasonGames){\n const section=$("cfpBracketSection"),board=$("cfpBracketBoard"),meta=$("cfpBracketMeta"),path=$("cfpBracketPath");if(!section||!board)return;'''
          new='''let cfpExpandedSeasonId=null;\nfunction toggleCfpBracketComplete(){\n const sid=String(S?.season_id||"");\n cfpExpandedSeasonId=String(cfpExpandedSeasonId||"")===sid?null:sid;\n renderSchedule();\n}\nwindow.toggleCfpBracketComplete=toggleCfpBracketComplete;\nfunction renderCfpBracket(allSeasonGames){\n const section=$("cfpBracketSection"),board=$("cfpBracketBoard"),meta=$("cfpBracketMeta"),path=$("cfpBracketPath"),compact=$("cfpBracketCompact");if(!section||!board)return;'''
          assert old in s
          s=s.replace(old,new,1)

          old=''' if(!first.length){section.classList.add("hidden");board.innerHTML="";return}\n section.classList.remove("hidden");'''
          new=''' if(!first.length){section.classList.add("hidden");section.classList.remove("cfp-complete","cfp-expanded");board.innerHTML="";if(compact)compact.innerHTML="";return}\n section.classList.remove("hidden");'''
          assert old in s
          s=s.replace(old,new,1)

          old=''' const champGame=ncActual[0]||null;\n const champTeams=champGame?cfpGamePair(champGame):[cfpAdvanceTeam(semiWinner(semis[0]))||cfpVirtualTeam("Winner SF1"),cfpAdvanceTeam(semiWinner(semis[1]))||cfpVirtualTeam("Winner SF2")];\n const controlled=fr.flatMap(cfpGamePair).find(t=>t.person_id);\n const controlledGame=controlled?fr.find(g=>cfpGamePair(g).some(t=>String(t.person_id||'')===String(controlled.person_id))):null;'''
          new=''' const champGame=ncActual[0]||null;\n const champTeams=champGame?cfpGamePair(champGame):[cfpAdvanceTeam(semiWinner(semis[0]))||cfpVirtualTeam("Winner SF1"),cfpAdvanceTeam(semiWinner(semis[1]))||cfpVirtualTeam("Winner SF2")];\n const controlled=fr.flatMap(cfpGamePair).find(t=>t.person_id)||fr.flatMap(g=>[{...cfpGamePair(g)[0],person_id:dynastyProgramForTeam(g,"team")?.person_id||null},{...cfpGamePair(g)[1],person_id:dynastyProgramForTeam(g,"opponent")?.person_id||null}]).find(t=>t.person_id);\n const controlledGame=controlled?fr.find(g=>[dynastyProgramForTeam(g,"team")?.person_id,dynastyProgramForTeam(g,"opponent")?.person_id,g.person_id,g.opponent_person_id].some(id=>id&&String(id)===String(controlled.person_id))):null;\n const champion=champGame?.status==="completed"?cfpBracketWinner(champGame):null;\n const championshipComplete=!!champion;\n const expandedAfterComplete=String(cfpExpandedSeasonId||"")===String(S?.season_id||"");\n section.classList.toggle("cfp-complete",championshipComplete);\n section.classList.toggle("cfp-expanded",!championshipComplete||expandedAfterComplete);\n if(championshipComplete&&compact){\n   const pair=cfpGamePair(champGame),runner=pair.find(t=>teamKey(t?.name)!==teamKey(champion?.name));\n   const champScore=runner&&champion?.score!=null&&runner?.score!=null?`${esc(champion.score)}–${esc(runner.score)}`:"Final";\n   const controlledPid=controlled?.person_id||null;\n   const foundryGames=controlledPid?playoffs.filter(g=>[dynastyProgramForTeam(g,"team")?.person_id,dynastyProgramForTeam(g,"opponent")?.person_id,g.person_id,g.opponent_person_id].some(id=>id&&String(id)===String(controlledPid))):[];\n   const stageRank=g=>g.game_type==="national_championship"||/national championship/i.test(String(g.week_label||g.event_name||""))?4:/semifinal/i.test(String(g.week_label||g.event_name||""))?3:/quarterfinal/i.test(String(g.week_label||g.event_name||""))?2:1;\n   const lastFoundry=[...foundryGames].sort((a,b)=>stageRank(b)-stageRank(a)||Number(b.week_number||0)-Number(a.week_number||0))[0]||null;\n   let foundrySummary="";\n   if(lastFoundry&&controlled){\n     const teamProg=dynastyProgramForTeam(lastFoundry,"team"),oppProg=dynastyProgramForTeam(lastFoundry,"opponent");\n     const useOpp=String(oppProg?.person_id||lastFoundry.opponent_person_id||"")===String(controlledPid);\n     const pf=Number(useOpp?lastFoundry.points_against:lastFoundry.points_for),pa=Number(useOpp?lastFoundry.points_for:lastFoundry.points_against);\n     const result=lastFoundry.status==="completed"&&Number.isFinite(pf)&&Number.isFinite(pa)&&pf!==pa?(pf>pa?"W":"L"):"";\n     const stage=String(lastFoundry.event_name||lastFoundry.week_label||"CFP");\n     foundrySummary=`<div class="cfp-compact-foundry"><b>FOUNDRY PATH</b> · ${esc(controlled.name)} · ${esc(stage)}${result?` · ${esc(result)} ${esc(pf)}–${esc(pa)}`:""}</div>`;\n   }\n   compact.innerHTML=`<div><div class="cfp-compact-kicker">COLLEGE FOOTBALL PLAYOFF · COMPLETE</div><div class="cfp-compact-title">${esc(champion.name)} · National Champion</div><div class="cfp-compact-meta"><b>${esc(champScore)}</b>${runner?` vs ${esc(runner.name)}`:""} · ${esc(champGame.event_name||"National Championship")}</div></div><button id="cfpBracketToggleBtn" class="cfp-compact-toggle" type="button" onclick="window.toggleCfpBracketComplete()">View CFP Bracket</button>${foundrySummary}`;\n }else if(compact){compact.innerHTML=""}\n'''
          assert old in s
          s=s.replace(old,new,1)

          old=''' meta.innerHTML=`<strong>${esc(S?.year||"")} CFP</strong> · 12-team field · ${playoffs.filter(g=>g.status==="completed").length} playoff final${playoffs.filter(g=>g.status==="completed").length===1?"":"s"}`;'''
          new=''' meta.innerHTML=`<strong>${esc(S?.year||"")} CFP</strong> · 12-team field · ${playoffs.filter(g=>g.status==="completed").length} playoff final${playoffs.filter(g=>g.status==="completed").length===1?"":"s"}${championshipComplete&&expandedAfterComplete?` · <button class="cfp-compact-toggle" type="button" onclick="window.toggleCfpBracketComplete()">Collapse CFP Bracket</button>`:""}`;'''
          assert old in s
          s=s.replace(old,new,1)

          s=s.replace('Saturday Foundry 9.6.18 — CFP Bracket Priority','Saturday Foundry 9.6.19 — CFP Completion Collapse',1)
          s=s.replace('9.6.18-cfp-bracket-priority','9.6.19-cfp-completion-collapse',1)
          p.write_text(s)
          PY

      - name: Verify regression anchors
        shell: bash
        run: |
          set -euo pipefail
          grep -q '9.6.19-cfp-completion-collapse' index.html
          grep -q 'cfp-bracket-compact' index.html
          grep -q 'COLLEGE FOOTBALL PLAYOFF · COMPLETE' index.html
          grep -q 'View CFP Bracket' index.html
          grep -q 'Collapse CFP Bracket' index.html
          grep -q 'function cfpAdvanceTeam(t){return t?{...t,score:null}:t}' index.html
          grep -q 'q.game?.event_name||q.meta?.quarterfinal_bowl' index.html
          grep -q 'window.CDHQRefresh=refreshFoundryData' index.html
          grep -q 'CPU-v-CPU is always neutral' index.html
          grep -q 'coach-bowl-ledger' index.html

      - name: Verify JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          out=Path('/tmp/sfjs'); out.mkdir(exist_ok=True)
          blocks=[]
          for m in re.finditer(r'<script\b([^>]*)>(.*?)</script>',s,re.I|re.S):
              if re.search(r'\bsrc\s*=',m.group(1),re.I): continue
              blocks.append(m.group(2))
          for i,b in enumerate(blocks): (out/f'{i:03}.js').write_text(b)
          print(f'inline_scripts={len(blocks)}')
          PY
          for f in /tmp/sfjs/*.js; do node --check "$f" >/dev/null; done

      - name: Commit build
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Saturday Foundry Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Release Saturday Foundry 9.6.19 CFP completion collapse'
          git push
