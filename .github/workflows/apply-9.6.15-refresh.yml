name: Apply Saturday Foundry 9.6.15 state-preserving refresh

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-9.6.15-refresh.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Apply 9.6.15 refresh patch
        shell: bash
        run: |
          set -euo pipefail
          grep -q '9.6.14-schedule-result-perspective' index.html
          printf '%s' '' | base64 -d | gunzip > /tmp/9.6.15.patch
          echo '853b527d8d094261519f72c2f387c3769f484ecc7b72e93dba54d1ae1940216e  /tmp/9.6.15.patch' | sha256sum -c -
          patch -p0 < /tmp/9.6.15.patch

      - name: Verify refresh and regression anchors
        shell: bash
        run: |
          set -euo pipefail
          grep -q '9.6.15-state-preserving-refresh' index.html
          grep -q 'window.CDHQRefresh=refreshFoundryData' index.html
          grep -q 'Refresh Data' index.html
          grep -q 'CPU-v-CPU is always neutral' index.html
          grep -q 'cfpBracketSection' index.html
          grep -q 'LEGACY DEFINES THE COACH\|Legacy Defines the Coach' index.html
          grep -q 'Career Bowl Ledger\|career-bowl-ledger' index.html

      - name: Verify JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/sfjs && mkdir -p /tmp/sfjs
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          blocks=[]
          for m in re.finditer(r'<script\b([^>]*)>(.*?)</script>',s,re.I|re.S):
              if re.search(r'\bsrc\s*=',m.group(1),re.I): continue
              blocks.append(m.group(2))
          out=Path('/tmp/sfjs')
          for i,b in enumerate(blocks):(out/f'{i:03}.js').write_text(b)
          print(f'inline_scripts={len(blocks)}')
          PY
          for f in /tmp/sfjs/*.js; do node --check "$f" >/dev/null; done

      - name: Commit refreshed build
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Saturday Foundry Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Release Saturday Foundry 9.6.15 state-preserving refresh'
          git push
