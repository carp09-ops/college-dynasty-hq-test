name: Apply Saturday Foundry 9.6.17 bowl name visibility

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-9.6.17-bowl-names.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Apply bowl name visibility patch
        shell: bash
        run: |
          set -euo pipefail
          grep -q '9.6.16-cfp-score-carryover-fix' index.html
          printf '%s' '' | base64 -d | gunzip > /tmp/9.6.17.patch
          echo 'd9ccba333f6442d48cd2e234262293c49a5c4c66d4ab20766c9cd9e639a0f9cf  /tmp/9.6.17.patch' | sha256sum -c -
          patch -p0 < /tmp/9.6.17.patch

      - name: Verify regression anchors
        shell: bash
        run: |
          set -euo pipefail
          grep -q '9.6.17-bowl-name-visibility' index.html
          grep -q 'Postseason event names are authoritative display context' index.html
          grep -q 'q.game?.event_name||q.meta?.quarterfinal_bowl' index.html
          grep -q 'function cfpAdvanceTeam(t){return t?{...t,score:null}:t}' index.html
          grep -q 'window.CDHQRefresh=refreshFoundryData' index.html
          grep -q 'CPU-v-CPU is always neutral' index.html
          grep -q 'coach-bowl-ledger' index.html

      - name: Verify JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          out=Path('/tmp/sfjs'); out.mkdir(exist_ok=True)
          blocks=[]
          for m in re.finditer(r'<script\b([^>]*)>(.*?)</script>',s,re.I|re.S):
              if re.search(r'\bsrc\s*=',m.group(1),re.I): continue
              blocks.append(m.group(2))
          for i,b in enumerate(blocks): (out/f'{i:03}.js').write_text(b)
          print(f'inline_scripts={len(blocks)}')
          PY
          for f in /tmp/sfjs/*.js; do node --check "$f" >/dev/null; done

      - name: Commit build
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Saturday Foundry Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Release Saturday Foundry 9.6.17 bowl name visibility'
          git push
